name: Build acheong08 Location Spoofer unsigned IPA

on:
  push:
    branches:
      - build/acheong-original-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 50

    steps:
      - name: Checkout original upstream source
        uses: actions/checkout@v4
        with:
          repository: acheong08/ios-location-spoofer
          ref: bfb44fa3b00e2cc8820536fb58e375d7269ef90a
          path: source
          persist-credentials: false

      - name: Select iOS 18-compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' -print | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode 16 installation found"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build iOS Go static library
        working-directory: source/GoSpoofer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./make.sh
          ./make.sh
          test -s build/libgolocationspoofer.a

      - name: Build original Swift iPhone app without signing
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' location-spoofer.xcodeproj/project.pbxproj
          sed -i '' 's/preferredProjectObjectVersion = 77;/preferredProjectObjectVersion = 56;/' location-spoofer.xcodeproj/project.pbxproj
          xcodebuild \
            -project location-spoofer.xcodeproj \
            -scheme location-spoofer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/LocationSpooferBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/LocationSpooferBuild/Build/Products/Release-iphoneos/location-spoofer.app"
          test -d "$APP"
          test -d "$APP/PlugIns/location-spoofer-tunnel.appex"
          mkdir -p "$RUNNER_TEMP/IpaOutput/Payload"
          ditto "$APP" "$RUNNER_TEMP/IpaOutput/Payload/location-spoofer.app"
          cd "$RUNNER_TEMP/IpaOutput"
          zip -qry acheong-ios-location-spoofer-unsigned.ipa Payload
          unzip -t acheong-ios-location-spoofer-unsigned.ipa
          shasum -a 256 acheong-ios-location-spoofer-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: acheong-original-ios-location-spoofer-unsigned-ipa
          path: ${{ runner.temp }}/IpaOutput/acheong-ios-location-spoofer-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
